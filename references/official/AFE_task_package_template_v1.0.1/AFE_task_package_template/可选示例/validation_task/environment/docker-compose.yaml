services:
  main:
    depends_on:
      validation:
        condition: service_healthy
  validation:
    build:
      context: ./validation_service
    command: ["python3", "/service/server.py"]
    expose: ["8000"]
    cpus: 1
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
