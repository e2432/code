schema_version = "1.4"
artifacts = [
  "/work/output",
  { source = "/validation_snapshot/session.json", service = "validation" }
]

[task]
name = "afe/validation-interface-demo"
version = "0.1.0"
description = "仅演示预算查询、服务状态交接与最终评分的合成题"
authors = [{ name = "AFE template example" }]

[metadata]
example_only = true

[metadata.afe]
protocol_version = "1.0"
level = "L1"
domains = ["信息"]
supports_over_target = true

[metadata.afe.score_mapping]
url = "tests/score.py"
description = "合成值达到 0.8 得 100，超过 0.8 标超目标；更低值按 value/0.8 映射。预算及有效查询条件同时成立。"

[metadata.afe.validation]
command = "python3 /work/tools/validate.py --candidate-id <候选ID>"
description = "查询合成候选值，最多 3 个不同候选；相同候选复用结果，非法请求不计费。"

[agent]
timeout_sec = 300

[environment]
workdir = "/work"
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
build_timeout_sec = 600
network_mode = "public"

[verifier]
environment_mode = "separate"
timeout_sec = 60

[[verifier.collect]]
service = "validation"
command = "python3 /service/export_state.py"
timeout_sec = 30

[verifier.environment]
workdir = "/tests"
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
build_timeout_sec = 600
network_mode = "no-network"
